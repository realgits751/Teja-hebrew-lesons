<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yalla - Malayalam & Hebrew</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 12px 0;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
      background: var(--card-bg);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      background: #eff6ff;
      padding: 4px 8px;
      border-radius: 6px;
      align-self: flex-start;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .malayalam {
      text-align: left;
      direction: ltr;
    }

    .mal-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e293b;
    }

    .translit {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hebrew {
      text-align: right;
      direction: rtl;
    }

    .heb-text {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
    }

    .heb-pronounce {
      font-size: 0.8rem;
      color: var(--muted);
      direction: ltr;
      text-align: right;
    }

    .quiz-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }
